<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Laboratorio Diédrico y rompecabezas: práctica de planos, punto, recta, trazas y vistas.">
<title>Laboratorio Diédrico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: encabezado con pestañas; Laboratorio = dos lienzos (3D y abatido) + controles; Rompecabezas = tablero 3x3 + panel de reto. */
:root {
  --bg: #F3F5FA; --paper: #FFFFFF; --ink: #1A2238; --muted: #5A6480; --line: #D9DFEC; --soft: #EAEEF7; --sel: #FFF1D6;
  --navy: #23325B; --gold: #F5A415; --gold-ink: #8A5300; --teal: #1B7F8C; --tsoft: #E2F3F5;
  --ok: #1E7A3C; --ok-bg: #E4F3E8; --bad: #B3261E; --bad-bg: #FBE7E5;
  --pv: #DCE4F5; --ph: #E3F1DC; --lt: #C62828; --p2: #2F5DA8; --p1: #2E7D32; --p3: #1B7F8C; --pt: #C62828; --grid: #E3E7F1;
  --btn: #23325B; --btn-ink: #FFFFFF;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1424; --paper: #182038; --ink: #EEF1F8; --muted: #A6AFC8; --line: #2C3654; --soft: #222B47; --sel: #3A3220;
  --navy: #9DB0E8; --gold: #F5B23A; --gold-ink: #F7C565; --teal: #5CC6D3; --tsoft: #173238;
  --ok: #7FD39A; --ok-bg: #173826; --bad: #FF9C93; --bad-bg: #42201E;
  --pv: #24304F; --ph: #1F3326; --lt: #FF6B6B; --p2: #8DB3FF; --p1: #7FD39A; --p3: #5CC6D3; --pt: #FF8A80; --grid: #26304A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1424; --paper: #182038; --ink: #EEF1F8; --muted: #A6AFC8; --line: #2C3654; --soft: #222B47; --sel: #3A3220;
  --navy: #9DB0E8; --gold: #F5B23A; --gold-ink: #F7C565; --teal: #5CC6D3; --tsoft: #173238;
  --ok: #7FD39A; --ok-bg: #173826; --bad: #FF9C93; --bad-bg: #42201E;
  --pv: #24304F; --ph: #1F3326; --lt: #FF6B6B; --p2: #8DB3FF; --p1: #7FD39A; --p3: #5CC6D3; --pt: #FF8A80; --grid: #26304A; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); min-height: 100%; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
h2 { font-size: clamp(19px, 3.4vw, 24px); font-weight: 600; line-height: 1.25; }
.eyebrow { font: 700 12px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); }
.muted { color: var(--muted); } p { margin: 0; }
.tabs { display: flex; gap: 6px; background: var(--soft); padding: 5px; border-radius: 12px; }
.tab { font: 700 15px var(--body); border: 0; background: transparent; color: var(--ink); padding: 9px 16px; border-radius: 9px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--paper); color: var(--navy); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: clamp(14px, 3vw, 22px); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn { font: 700 16px var(--body); border: 0; border-radius: 11px; padding: 11px 18px; cursor: pointer; background: var(--btn); color: var(--btn-ink); }
.btn.gold { background: var(--gold); color: var(--btn); } .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn[disabled] { opacity: .45; cursor: default; }

/* Laboratorio */
.lab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 760px) { .lab { grid-template-columns: 1fr; } }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-width: 0; }
.panel h3 { font-size: 16px; color: var(--navy); margin-bottom: 6px; }
.panel svg { display: block; width: 100%; height: auto; }
svg text { font-family: var(--body); font-weight: 700; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 18px; margin-top: 14px; }
.ctl label { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }
.ctl label b { font-family: var(--display); color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.ctl input[type=range] { width: 100%; accent-color: var(--navy); }
.seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 4px; gap: 4px; }
.seg button { font: 700 14px var(--body); border: 0; background: transparent; color: var(--ink); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--paper); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.readout div { background: var(--soft); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.readout span { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.readout strong { font-family: var(--display); font-size: 19px; color: var(--navy); }
.coords { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.coords input { width: 100%; font: 700 16px var(--body); padding: 7px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); text-align: center; }
.hint { font-size: 14px; color: var(--muted); }

/* Rompecabezas */
.game { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .game { grid-template-columns: 1fr; } }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--line); border-radius: 14px; padding: 4px; aspect-ratio: 1; max-width: 100%; }
.tile { position: relative; border: 0; padding: 0; cursor: pointer; border-radius: 8px; overflow: hidden; background: var(--navy); color: var(--paper); aspect-ratio: 1; }
.tile .face { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 6px; }
.tile .face b { font-family: var(--display); font-size: 30px; display: block; line-height: 1; }
.tile .face small { font-size: 12px; font-weight: 700; opacity: .9; }
.tile.active { outline: 4px solid var(--gold); outline-offset: -4px; }
.tile.done { cursor: default; background: var(--paper); }
.tile svg { width: 100%; height: 100%; display: block; }
.tile .letter { position: absolute; right: 6px; bottom: 6px; width: 30px; height: 30px; border-radius: 8px; background: var(--gold); color: #1A2238; font: 800 18px var(--display); display: grid; place-items: center; }
.word { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 12px; }
.word span { width: 32px; height: 38px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font: 800 20px var(--display); color: var(--navy); }
.word span.on { background: var(--gold); color: #1A2238; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.stats div { background: var(--soft); border-radius: 10px; padding: 6px 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opt { text-align: left; font: 16px/1.3 var(--body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 11px; padding: 12px 14px; cursor: pointer; min-width: 0; }
.opt:hover:not([disabled]) { border-color: var(--navy); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); } .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
figure { margin: 0; background: var(--bg); border-radius: 12px; padding: 6px; }
figure svg { display: block; width: 100%; height: auto; max-height: 330px; }
.tap svg { cursor: crosshair; touch-action: manipulation; }
.feedback { border-radius: 12px; padding: 12px 14px; background: var(--soft); }
.feedback.ok { background: var(--ok-bg); } .feedback.bad { background: var(--bad-bg); }
.feedback b { font-family: var(--display); }
.nums { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.nums label { display: flex; flex-direction: column; font-weight: 700; font-size: 14px; gap: 4px; }
.nums input { width: 110px; font: 700 20px var(--display); text-align: center; padding: 8px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; padding: 8px; border: 1.5px dashed var(--line); border-radius: 12px; }
.item { background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 4px; cursor: pointer; width: 96px; }
.item svg { display: block; width: 100%; height: auto; }
.item.sel { border-color: var(--gold); background: var(--sel); box-shadow: 0 0 0 2px var(--gold); }
.item.ok { border-color: var(--ok); background: var(--ok-bg); } .item.bad { border-color: var(--bad); background: var(--bad-bg); }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.bin { background: var(--soft); border: 1.5px solid transparent; border-radius: 12px; padding: 8px; min-height: 120px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: var(--ink); min-width: 0; }
.bin.ready { border-color: var(--gold); border-style: dashed; }
.bin > b { font-family: var(--display); color: var(--navy); font-size: 14px; }
.bin .slot { display: flex; flex-wrap: wrap; gap: 6px; }
input[type=text] { width: 100%; font: 17px var(--body); padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
textarea { width: 100%; font: 15px/1.4 var(--body); padding: 10px; border-radius: 10px; border: 1.5px dashed var(--line); background: var(--bg); color: var(--ink); resize: none; }
footer { text-align: center; font-size: 13px; color: var(--muted); margin-top: 18px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.flip { animation: flip .45s ease; } @keyframes flip { from { transform: rotateY(90deg); } to { transform: none; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div><span class="eyebrow">Geometría · Sistema diédrico</span><h1>Laboratorio Diédrico</h1></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-lab" aria-selected="true">Laboratorio</button>
      <button class="tab" role="tab" id="t-puz" aria-selected="false">Rompecabezas</button>
    </div>
  </header>
  <section id="v-lab"></section>
  <section id="v-puz" hidden></section>
  <footer>Planos de proyección, punto, recta, trazas y vistas · Ingeniería Agroecológica</footer>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const R = x => Math.round(x * 10) / 10;

/* ===================== utilidades de dibujo ===================== */
function proj(p, az, el) { // p = [x, y(alejamiento), z(cota)]; observador al frente (y > 0)
  const a = az * Math.PI / 180, e = el * Math.PI / 180;
  const X = p[0] * Math.cos(a) + p[1] * Math.sin(a);
  const c = -p[0] * Math.sin(a) + p[1] * Math.cos(a);
  return [X, p[2] * Math.cos(e) - c * Math.sin(e)];
}
const line = (a, b, col, w = 2, dash = "") => `<line x1="${R(a[0])}" y1="${R(a[1])}" x2="${R(b[0])}" y2="${R(b[1])}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${dash ? `stroke-dasharray="${dash}"` : ""}/>`;
const dot = (p, col, r = 5) => `<circle cx="${R(p[0])}" cy="${R(p[1])}" r="${r}" fill="${col}"/>`;
const lab = (p, t, col, dx = 8, dy = -8, size = 14) => `<text x="${R(p[0] + dx)}" y="${R(p[1] + dy)}" font-size="${size}" style="fill:${col}">${t}</text>`;
const polyS = (pts, fill, op = 1) => `<polygon points="${pts.map(p => R(p[0]) + "," + R(p[1])).join(" ")}" fill="${fill}" fill-opacity="${op}" stroke="var(--navy)" stroke-width="1"/>`;

/* ===================== LABORATORIO ===================== */
const L = { mode: "punto", x: 4, y: 3, z: 3, phi: 0, az: -35, A: [1, 1, 4], B: [5, 3, 2] };

function quadrant(y, z) {
  if (y === 0 && z === 0) return "Sobre la LT";
  if (z === 0) return y > 0 ? "En el PH anterior" : "En el PH posterior";
  if (y === 0) return z > 0 ? "En el PV superior" : "En el PV inferior";
  if (z > 0) return y > 0 ? "Cuadrante I" : "Cuadrante II";
  return y > 0 ? "Cuadrante IV" : "Cuadrante III";
}
function rType(d) {
  const [dx, dy, dz] = d.map(v => Math.abs(v) < 1e-9 ? 0 : v);
  if (!dx && !dy && !dz) return "A y B coinciden";
  if (!dy && !dz) return "Paralela a la LT";
  if (!dx && !dy) return "Vertical";
  if (!dx && !dz) return "De punta";
  if (!dz) return "Horizontal";
  if (!dy) return "Frontal";
  if (!dx) return "De perfil";
  return "Oblicua";
}

function lab3D() {
  const W = 420, H = 340, az = L.az, el = 22, s = 26, ox = 150, oy = 175, ph = L.phi * Math.PI / 180;
  const T = p => { const q = proj(p, az, el); return [ox + s * q[0], oy - s * q[1]]; };
  const rotPH = p => [p[0], p[1] * Math.cos(ph), -p[1] * Math.sin(ph)];
  const X0 = -1, X1 = 9, E = 5;
  let b = "";
  b += polyS([T(rotPH([X0, 0, 0])), T(rotPH([X1, 0, 0])), T(rotPH([X1, -E, 0])), T(rotPH([X0, -E, 0]))], "var(--ph)", .75);
  b += polyS([T([X0, 0, -E]), T([X1, 0, -E]), T([X1, 0, E]), T([X0, 0, E])], "var(--pv)", .8);
  b += polyS([T(rotPH([X0, 0, 0])), T(rotPH([X1, 0, 0])), T(rotPH([X1, E, 0])), T(rotPH([X0, E, 0]))], "var(--ph)", .8);
  b += line(T([X0 - .3, 0, 0]), T([X1 + .5, 0, 0]), "var(--lt)", 3);
  b += lab(T([X1 + .6, 0, 0]), "LT", "var(--lt)", 2, 4) + lab(T([X1, 0, E]), "PV", "var(--navy)", 4, 14) + lab(T(rotPH([X0, E, 0])), "PH", "var(--p1)", -22, 4);
  if (L.mode === "punto") {
    const P = [L.x, L.y, L.z], P1 = rotPH([L.x, L.y, 0]), P2 = [L.x, 0, L.z], P0 = [L.x, 0, 0];
    b += line(T(P), T(P2), "var(--gold)", 1.6, "5 4") + line(T(P), T([L.x, L.y, 0]), "var(--gold)", 1.6, "5 4");
    b += line(T(P2), T(P0), "var(--p2)", 1.4, "2 3") + line(T(P1), T(P0), "var(--p1)", 1.4, "2 3");
    b += dot(T(P2), "var(--p2)") + lab(T(P2), "P₂", "var(--p2)") + dot(T(P1), "var(--p1)") + lab(T(P1), "P₁", "var(--p1)", 8, 16);
    if (L.phi < 1) b += dot(T(P), "var(--pt)", 6) + lab(T(P), "P", "var(--pt)", 8, -8, 16);
  } else {
    const A = L.A, B = L.B, d = [B[0] - A[0], B[1] - A[1], B[2] - A[2]];
    const pt = t => [A[0] + d[0] * t, A[1] + d[1] * t, A[2] + d[2] * t];
    const n = Math.hypot(...d) || 1, t0 = -12 / n, t1 = 12 / n;
    let ts = [t0, t1];
    const clip = () => { // recorta el segmento a la caja visible
      let a = t0, c = t1;
      [[0, X0, X1], [1, -E, E], [2, -E, E]].forEach(([i, lo, hi]) => {
        if (Math.abs(d[i]) < 1e-9) { if (A[i] < lo || A[i] > hi) { a = 1; c = 0; } return; }
        let u = (lo - A[i]) / d[i], v = (hi - A[i]) / d[i]; if (u > v) [u, v] = [v, u]; a = Math.max(a, u); c = Math.min(c, v); });
      return [a, c];
    };
    ts = clip();
    if (ts[0] < ts[1]) {
      const p = pt(ts[0]), q = pt(ts[1]);
      b += line(T([p[0], 0, p[2]]), T([q[0], 0, q[2]]), "var(--p2)", 2.4) + line(T(rotPH([p[0], p[1], 0])), T(rotPH([q[0], q[1], 0])), "var(--p1)", 2.4);
      if (L.phi < 1) b += line(T(p), T(q), "var(--pt)", 3);
    }
    [["A", A], ["B", B]].forEach(([nm, P]) => { if (L.phi < 1) b += dot(T(P), "var(--pt)", 5) + lab(T(P), nm, "var(--pt)"); });
    const tr = trazas();
    if (tr.H) b += dot(T(rotPH(tr.H)), "var(--p1)", 6) + lab(T(rotPH(tr.H)), "H", "var(--p1)", 8, 16);
    if (tr.V) b += dot(T(tr.V), "var(--p2)", 6) + lab(T(tr.V), "V", "var(--p2)");
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vista en 3D de los planos de proyección">${b}</svg>`;
}
function trazas() {
  const A = L.A, B = L.B, d = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], out = {};
  if (Math.abs(d[2]) > 1e-9) { const t = -A[2] / d[2]; out.H = [A[0] + d[0] * t, A[1] + d[1] * t, 0]; }
  if (Math.abs(d[1]) > 1e-9) { const t = -A[1] / d[1]; out.V = [A[0] + d[0] * t, 0, A[2] + d[2] * t]; }
  return out;
}
function labAbatido() {
  const W = 420, H = 340, s = 26, ox = 50, oy = 170; const T = (x, v) => [ox + s * x, oy - s * v];
  let b = "";
  for (let x = -1; x <= 13; x++) b += line(T(x, -6), T(x, 6), "var(--grid)", 1);
  for (let v = -6; v <= 6; v++) b += line(T(-1, v), T(13, v), "var(--grid)", 1);
  b += line(T(-1, 0), T(13, 0), "var(--lt)", 3) + lab(T(12.2, 0), "LT", "var(--lt)", 0, -8);
  b += line(T(-.8, -.25), T(-.1, -.25), "var(--lt)", 2.5) + line(T(12, -.25), T(12.7, -.25), "var(--lt)", 2.5);
  b += `<text x="${T(12.7, 5.4)[0]}" y="${T(12.7, 5.4)[1]}" font-size="12" text-anchor="end" style="fill:var(--muted)">PV</text><text x="${T(-.8, -5.8)[0]}" y="${T(-.8, -5.8)[1]}" font-size="12" style="fill:var(--muted)">PH abatido</text>`;
  if (L.mode === "punto") {
    const P2 = T(L.x, L.z), P1 = T(L.x, -L.y);
    b += line(P2, P1, "var(--muted)", 1.3, "5 4") + dot(P2, "var(--p2)", 6) + lab(P2, "P₂", "var(--p2)") + dot(P1, "var(--p1)", 6) + lab(P1, "P₁", "var(--p1)", 8, 16);
    b += lab(T(L.x, L.z / 2), `cota ${L.z}`, "var(--gold-ink)", 8, 4, 12) + lab(T(L.x, -L.y / 2), `alej. ${L.y}`, "var(--gold-ink)", 8, 4, 12);
  } else {
    const A = L.A, B = L.B, d = [B[0] - A[0], B[1] - A[1], B[2] - A[2]];
    const ext = (i) => { // proyección i: 2 → (x, z), 1 → (x, −y)
      const f = p => i === 2 ? [p[0], p[2]] : [p[0], -p[1]];
      const a = f(A), c = f([A[0] + d[0], A[1] + d[1], A[2] + d[2]]); const dd = [c[0] - a[0], c[1] - a[1]];
      if (Math.hypot(...dd) < 1e-9) return dot(T(...a), i === 2 ? "var(--p2)" : "var(--p1)", 7);
      const k = 40; return line(T(a[0] - dd[0] * k, a[1] - dd[1] * k), T(a[0] + dd[0] * k, a[1] + dd[1] * k), i === 2 ? "var(--p2)" : "var(--p1)", 2.6);
    };
    b = `<defs><clipPath id="cl"><rect x="${T(-1, 6)[0]}" y="${T(-1, 6)[1]}" width="${s * 14}" height="${s * 12}"/></clipPath></defs>` + b + `<g clip-path="url(#cl)">${ext(2)}${ext(1)}</g>`;
    [["A", A], ["B", B]].forEach(([n, P]) => { const p2 = T(P[0], P[2]), p1 = T(P[0], -P[1]);
      b += line(p2, p1, "var(--muted)", 1, "4 4") + dot(p2, "var(--p2)") + lab(p2, n + "₂", "var(--p2)") + dot(p1, "var(--p1)") + lab(p1, n + "₁", "var(--p1)", 8, 16); });
    const tr = trazas();
    if (tr.H) { const h1 = T(tr.H[0], -tr.H[1]), h2 = T(tr.H[0], 0); b += line(h2, h1, "var(--p1)", 1, "3 3") + `<rect x="${h1[0] - 6}" y="${h1[1] - 6}" width="12" height="12" fill="var(--p1)"/>` + lab(h1, "H₁", "var(--p1)", 9, 16); }
    if (tr.V) { const v2 = T(tr.V[0], tr.V[2]), v1 = T(tr.V[0], 0); b += line(v1, v2, "var(--p2)", 1, "3 3") + `<rect x="${v2[0] - 6}" y="${v2[1] - 6}" width="12" height="12" fill="var(--p2)"/>` + lab(v2, "V₂", "var(--p2)", 9, -8); }
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Abatimiento en dos dimensiones con la línea de tierra">${b}</svg>`;
}
const fmt = v => (Math.round(v * 100) / 100).toString().replace(".", ",");

function renderLab() {

      </div>

function slider(id, label, min, max, step, val) {
  return `<div class="ctl"><label for="${id}">${label} <b id="${id}-v">${fmt(val)}</b></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}
function buildCtl() {
  $("#m-punto").setAttribute("aria-pressed", L.mode === "punto"); $("#m-recta").setAttribute("aria-pressed", L.mode === "recta");
  let h = `<div class="controls">`;
  if (L.mode === "punto") h += slider("sx", "Abscisa x", 0, 8, 1, L.x) + slider("sy", "Alejamiento (y)", -5, 5, 1, L.y) + slider("sz", "Cota (z)", -5, 5, 1, L.z);
  else h += ["A", "B"].map(n => `<div class="ctl"><label>Punto ${n} (x, alejamiento, cota)</label><div class="coords">${[0, 1, 2].map(i => `<input type="number" id="${n}${i}" value="${L[n][i]}" step="1" min="-5" max="9" aria-label="${n} ${["x", "alejamiento", "cota"][i]}">`).join("")}</div></div>`).join("");
  h += slider("sphi", "Abatir el PH (grados)", 0, 90, 1, L.phi) + slider("saz", "Girar la vista 3D", -70, 20, 1, L.az) + `</div>`;
  $("#ctl").innerHTML = h;
  const bind = (id, key) => { const el = $("#" + id); if (!el) return; el.oninput = () => { L[key] = +el.value; $("#" + id + "-v").textContent = fmt(+el.value); draw(); }; };
  bind("sx", "x"); bind("sy", "y"); bind("sz", "z"); bind("sphi", "phi"); bind("saz", "az");
  ["A", "B"].forEach(n => [0, 1, 2].forEach(i => { const el = $("#" + n + i); if (el) el.oninput = () => { const v = parseFloat(el.value); if (!isNaN(v)) { L[n][i] = v; draw(); } }; }));
}
function draw() {
  $("#c3d").innerHTML = lab3D(); $("#cab").innerHTML = labAbatido();
  let ro;
  if (L.mode === "punto") {
    const pos = v => v > 0 ? "encima de LT" : v < 0 ? "debajo de LT" : "sobre la LT";
    ro = [["Ubicación", quadrant(L.y, L.z)], ["P₂ (alzado)", pos(L.z)], ["P₁ (planta)", pos(-L.y)], ["Coordenadas", `P(${L.x}, ${L.y}, ${L.z})`]];
  } else {
    const d = [0, 1, 2].map(i => L.B[i] - L.A[i]), tr = trazas();
    ro = [["Tipo de recta", rType(d)], ["Traza horizontal H", tr.H ? `(${fmt(tr.H[0])}, ${fmt(tr.H[1])}, 0)` : "No tiene"], ["Traza vertical V", tr.V ? `(${fmt(tr.V[0])}, 0, ${fmt(tr.V[2])})` : "No tiene"],
          ["Verdadera magnitud AB", fmt(Math.hypot(...d))]];
  }
  $("#ro").innerHTML = ro.map(([a, b]) => `<div><span>${a}</span><strong>${esc(b)}</strong></div>`).join("");
}

/* ===================== ROMPECABEZAS ===================== */
const WORD = "CUADRANTE";
const SC = 30, OX = 30, OY = 165; // escala del abatido de los retos
const TA = (x, v) => [OX + SC * x, OY - SC * v];
function grid(x0 = 0, x1 = 9, v0 = -5, v1 = 5) {
  let b = ""; for (let x = x0; x <= x1; x++) b += line(TA(x, v0), TA(x, v1), "var(--grid)", 1);
  for (let v = v0; v <= v1; v++) b += line(TA(x0, v), TA(x1, v), "var(--grid)", 1);
  b += line(TA(x0, 0), TA(x1, 0), "var(--lt)", 3) + lab(TA(x1, 0), "LT", "var(--lt)", 4, -6, 13);
  for (let x = x0; x <= x1; x++) b += `<text x="${TA(x, v0)[0]}" y="${TA(x, v0)[1] + 16}" font-size="11" text-anchor="middle" style="fill:var(--muted)">${x}</text>`;
  return b;
}
const absvg = (body, label) => `<svg viewBox="0 0 330 340" role="img" aria-label="${label}">${grid()}${body}</svg>`;
function pointAB(n, x, y, z) { const p2 = TA(x, z), p1 = TA(x, -y); return line(p2, p1, "var(--muted)", 1.2, "5 4") + dot(p2, "var(--p2)", 6) + lab(p2, n + "₂", "var(--p2)") + dot(p1, "var(--p1)", 6) + lab(p1, n + "₁", "var(--p1)", 8, 16); }
const miniAB = (r2, r1) => { // r2 / r1: [[x,v],[x,v]] o [[x,v]] para un punto
  let b = line([20, 110], [300, 110], "var(--lt)", 3);
  const draw = (r, col) => r.length === 1 ? dot(r[0], col, 7) : line(r[0], r[1], col, 4);
  return `<svg viewBox="0 0 320 220" role="img" aria-label="Proyecciones de una recta">${b}${draw(r2, "var(--p2)")}${draw(r1, "var(--p1)")}
    <text x="290" y="40" font-size="14" style="fill:var(--p2)">r₂</text><text x="290" y="200" font-size="14" style="fill:var(--p1)">r₁</text></svg>`;
};
const viewSVG = (body) => `<svg viewBox="0 0 100 80">${body}</svg>`;
const R_ = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="var(--navy)" stroke-width="2.5"/>`;
const L_ = pts => `<polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="2.5"/>`;
const ISO_L = `<svg viewBox="0 0 220 170" role="img" aria-label="Pieza en L"><polygon points="66.7,97.5 131.7,135.0 175.0,110.0 110.0,72.5" fill="#C9A27A" stroke="#23325B" stroke-width="1.5" stroke-linejoin="round"/><polygon points="131.7,160.0 175.0,135.0 175.0,110.0 131.7,135.0" fill="#8E6A45" stroke="#23325B" stroke-width="1.5" stroke-linejoin="round"/><polygon points="66.7,97.5 110.0,72.5 110.0,22.5 66.7,47.5" fill="#8E6A45" stroke="#23325B" stroke-width="1.5" stroke-linejoin="round"/><polygon points="45.0,35.0 66.7,47.5 110.0,22.5 88.3,10.0" fill="#C9A27A" stroke="#23325B" stroke-width="1.5" stroke-linejoin="round"/><polygon points="45.0,110.0 131.7,160.0 131.7,135.0 66.7,97.5 66.7,47.5 45.0,35.0" fill="#A9764B" stroke="#23325B" stroke-width="1.5" stroke-linejoin="round"/></svg>`;

const CH = [

      + pointAB("P", 3, 1.9, 3.3) + (() => { const x = 6, z = 4.2 - 2.8 * (x - .3) / 8.4; return pointAB("Q", x, 4.6, z); })() + pointAB("S", 7.5, 2.4, 3.5), "Recta r y puntos P, Q y S"),
    o: ["P", "Q", "S", "Ninguno"], a: 0, e: "Un punto pertenece a la recta si P₂ está sobre r₂ y P₁ sobre r₁. Q solo cumple en el alzado; S no cumple en ninguna." },

let G = null;
function newGame(name) { G = { name, done: Array(9).fill(false), errs: Array(9).fill(0), active: null, t0: Date.now() }; renderPuz(); }
function scoreOf(i) { return G.done[i] ? Math.max(25, 100 - 25 * G.errs[i]) : 0; }
const total = () => G.done.reduce((s, d, i) => s + scoreOf(i), 0);
const elapsed = () => { const s = Math.round((Date.now() - G.t0) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function scene() { // imagen oculta: invernadero con su plano
  return `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD3F2"/><stop offset="1" stop-color="#E9F6FB"/></linearGradient></defs>
  <rect width="600" height="600" fill="url(#sky)"/><circle cx="500" cy="95" r="48" fill="#F5C23A"/>

  <rect y="400" width="600" height="200" fill="#8C6A43"/>

  ${[0, 1, 2, 3, 4].map(i => [0, 1, 2, 3].map(j => `<circle cx="${77 + i * 115}" cy="${455 + j * 35}" r="12" fill="#3F7F35"/>`).join("")).join("")}
  <polygon points="90,400 90,250 300,170 510,250 510,400" fill="#E8F4F8" fill-opacity=".9" stroke="#23325B" stroke-width="6"/>
  ${[160, 230, 300, 370, 440].map(x => `<line x1="${x}" y1="400" x2="${x}" y2="${x <= 300 ? 250 - (x - 90) * 80 / 210 + 0 : 250 - (510 - x) * 80 / 210}" stroke="#23325B" stroke-width="3"/>`).join("")}
  <line x1="90" y1="250" x2="510" y2="250" stroke="#23325B" stroke-width="3"/>
  <rect x="270" y="320" width="60" height="80" fill="#A9764B" stroke="#23325B" stroke-width="3"/>
  <rect x="540" y="300" width="40" height="100" fill="#A9764B" stroke="#23325B" stroke-width="3"/><ellipse cx="560" cy="300" rx="34" ry="12" fill="#3E7CB1"/><rect x="526" y="230" width="68" height="70" fill="#3E7CB1"/>
  <text x="300" y="135" font-size="34" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" fill="#23325B">¡Lo armaste!</text>`;
}
const tileSVG = i => `<svg viewBox="${(i % 3) * 200} ${Math.floor(i / 3) * 200} 200 200" aria-hidden="true">${scene()}</svg>`;

function renderPuz() {
  const v = $("#v-puz");
  if (!G) {
    let saved = ""; try { saved = localStorage.getItem("diedrico-nombre") || ""; } catch (e) {}
    v.innerHTML = `<div class="card stack" style="max-width:720px">
      <span class="eyebrow">Actividad · Rompecabezas diédrico</span><h2>Nueve piezas, nueve retos distintos</h2>
      <p class="muted">Cada pieza esconde un reto: ubicar puntos, leer coordenadas, encontrar trazas, armar vistas… Elige las piezas en el orden que quieras. Al resolver una, se descubre un trozo de la imagen y una letra de la palabra secreta.</p>
      <p class="muted">Cada pieza vale 100 puntos; cada intento fallido le resta 25.</p>
      <div id="pf" class="stack" style="gap:8px"><label for="pname"><b>Tu nombre</b></label><input type="text" id="pname" maxlength="40" placeholder="Ej.: Andrés Rojas" value="${esc(saved)}">
      <div class="row"><button class="btn" type="button" id="pstart">Empezar el rompecabezas</button></div></div></div>`;
    const go = () => { const n = $("#pname").value.trim() || "Estudiante"; try { localStorage.setItem("diedrico-nombre", n); } catch (er) {} newGame(n); };
    $("#pstart").onclick = go; $("#pname").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); go(); } };
    return;
  }
  const nDone = G.done.filter(Boolean).length;
  v.innerHTML = `<div class="game">
    <div class="card"><div class="board" id="board">${CH.map((c, i) => G.done[i]
        ? `<button class="tile done" aria-label="Pieza ${i + 1} resuelta">${tileSVG(i)}<span class="letter">${WORD[i]}</span></button>`
        : `<button class="tile ${G.active === i ? "active" : ""}" data-i="${i}" aria-label="Pieza ${i + 1}: ${c.title}"><span class="face"><span><b>${i + 1}</b><small>${c.title}</small></span></span></button>`).join("")}</div>
      <div class="word" aria-label="Palabra secreta">${[...WORD].map((ch, i) => `<span class="${G.done[i] ? "on" : ""}">${G.done[i] ? ch : ""}</span>`).join("")}</div>
      <div class="stats"><div>${nDone}/9 piezas</div><div>${total()} pts</div><div id="clock">${elapsed()}</div></div></div>
    <div class="card" id="panel"></div></div>`;
  v.querySelectorAll(".tile[data-i]").forEach(b => b.onclick = () => { G.active = +b.dataset.i; renderPuz(); });
  if (nDone === 9) return finish();
  if (G.active === null) $("#panel").innerHTML = `<div class="stack"><h2>Elige una pieza</h2><p class="muted">Toca cualquier pieza del tablero para ver su reto. Puedes resolverlas en el orden que quieras.</p></div>`;
  else openChallenge(G.active);
}
setInterval(() => { const c = $("#clock"); if (c && G && G.done.some(d => !d)) c.textContent = elapsed(); }, 1000);

function feedback(ok, text) {
  const f = $("#fb"); f.innerHTML = `<div class="feedback ${ok ? "ok" : "bad"}"><p><b>${ok ? "¡Pieza ganada!" : "Todavía no."}</b> ${esc(text)}</p></div>`;
  if (ok) { const i = G.active; G.done[i] = true; setTimeout(() => { G.active = null; renderPuz(); const t = document.querySelectorAll(".tile")[i]; if (t) t.classList.add("flip"); }, 1400); }
  else G.errs[G.active]++;
}

function openChallenge(i) {
  const c = CH[i], P = $("#panel");
  P.innerHTML = `<div class="stack"><span class="eyebrow">Pieza ${i + 1} · ${c.title}</span><h2>${esc(c.q)}</h2><div id="ch" class="stack"></div><div id="fb"></div></div>`;
  const box = $("#ch");
  if (c.k === "mcq") {
    box.innerHTML = (c.fig ? `<figure>${c.fig}</figure>` : "") + `<div class="opts">${c.o.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => { const k = +b.dataset.k;
      if (k === c.a) { box.querySelectorAll(".opt").forEach(x => x.disabled = true); b.classList.add("right"); feedback(true, c.e); }
      else { b.classList.add("wrong"); b.disabled = true; feedback(false, "Revisa de nuevo las proyecciones y vuelve a intentarlo."); } });
  } else if (c.k === "num") {
    box.innerHTML = `<figure>${c.fig}</figure><div class="nums" id="nf">${c.fields.map((f, k) => `<label for="nf${k}">${f[0]}<input type="text" inputmode="numeric" id="nf${k}" autocomplete="off"></label>`).join("")}<button class="btn" type="button" id="nfgo">Comprobar</button></div>`;
    const chkN = () => { const ok = c.fields.every((f, k) => parseFloat($("#nf" + k).value.replace(",", ".")) === f[1]);
      feedback(ok, ok ? c.e : "Mide desde la LT: hacia arriba hasta la proyección vertical y hacia abajo hasta la horizontal."); };
    $("#nfgo").onclick = chkN; $("#nf").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); chkN(); } };
  } else if (c.k === "tap2" || c.k === "tap1") {
    const n = c.k === "tap2" ? 2 : 1; let picks = [];
    const body = typeof c.fig === "function" ? c.fig() : "";
    box.innerHTML = `<figure class="tap"><svg viewBox="0 0 330 340" id="tsv" role="img" aria-label="Abatimiento: toca para marcar"><rect width="330" height="340" fill="transparent"/>${grid()}${body}<g id="mk"></g></svg></figure>
      <div class="row"><button class="btn ghost" id="undo">Borrar marcas</button><button class="btn" id="chk" disabled>Comprobar</button><span class="hint" id="th">${n === 2 ? "Toca P₂ (arriba) y luego P₁." : "Toca el punto de la traza."}</span></div>`;
    const sv = $("#tsv"), mk = $("#mk");
    const paint = () => { mk.innerHTML = picks.map((p, k) => { const s = TA(p[0], p[1]); return `<circle cx="${s[0]}" cy="${s[1]}" r="10" fill="none" stroke="var(--gold)" stroke-width="3"/>${dot(s, "var(--gold)", 4)}${lab(s, n === 2 ? ["P₂", "P₁"][k] : "H₁", "var(--gold-ink)")}`; }).join(""); $("#chk").disabled = picks.length < n; };
    sv.addEventListener("click", e => { if (picks.length >= n) return; const pt = sv.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(sv.getScreenCTM().inverse());
      picks.push([Math.round((q.x - OX) / SC), Math.round((OY - q.y) / SC)]); paint(); });
    $("#undo").onclick = () => { picks = []; paint(); };
    $("#chk").onclick = () => { const tg = n === 2 ? c.targets : [c.target]; const ok = tg.every((t, k) => picks[k] && picks[k][0] === t[0] && picks[k][1] === t[1]);
      if (!ok) { picks = []; paint(); } feedback(ok, ok ? c.e : (n === 2 ? "Recuerda: P₂ a la altura de la cota, encima de la LT; P₁ a la distancia del alejamiento, debajo." : "Busca dónde r₂ corta la LT y baja hasta r₁.")); };
  } else if (c.k === "cls") {
    const place = {}; let sel = null;
    box.innerHTML = `<figure style="max-width:260px">${c.fig}</figure><div class="pool" id="pool"></div><div class="bins">${c.bins.map((b, k) => `<div class="bin" role="button" tabindex="0" data-b="${k}"><b>${b}</b><div class="slot"></div></div>`).join("")}</div>
      <div class="row"><button class="btn" id="chk">Comprobar</button><span class="hint">Toca una pieza y luego su vista.</span></div>`;
    const els = c.items.map((it, k) => { const b = document.createElement("button"); b.className = "item"; b.innerHTML = it.s; b.setAttribute("aria-label", "Pieza de vista " + (k + 1));
      b.onclick = e => { e.stopPropagation(); sel = sel === k ? null : k; els.forEach((x, j) => x.classList.toggle("sel", j === sel)); box.querySelectorAll(".bin").forEach(x => x.classList.toggle("ready", sel !== null)); }; return b; });
    [3, 0, 4, 2, 1].forEach(k => $("#pool").appendChild(els[k]));
    box.querySelectorAll(".bin").forEach(bin => { const act = () => { if (sel === null) return; place[sel] = +bin.dataset.b; bin.querySelector(".slot").appendChild(els[sel]); els[sel].classList.remove("sel"); sel = null; box.querySelectorAll(".bin").forEach(x => x.classList.remove("ready")); };
      bin.onclick = act; bin.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } }; });
    $("#chk").onclick = () => { let ok = true; c.items.forEach((it, k) => { const r = place[k] === it.c; els[k].classList.toggle("ok", r); els[k].classList.toggle("bad", !r); if (!r) ok = false; });
      feedback(ok, ok ? c.e : "Hay piezas mal ubicadas (en rojo). Muévelas y vuelve a comprobar."); };
  }
}

function finish() {
  const pts = total(), errs = G.errs.reduce((a, b) => a + b, 0);
  const txt = `Rompecabezas diédrico · ${G.name} · ${pts}/900 pts · palabra: ${WORD} · tiempo ${elapsed()} · intentos fallidos: ${errs}`;
  $("#panel").innerHTML = `<div class="stack"><span class="eyebrow">¡Rompecabezas completo!</span><h2>Palabra secreta: ${WORD}</h2>
    <p class="muted">El sistema diédrico divide el espacio en cuatro cuadrantes. Cuéntale a tu grupo: ¿en qué cuadrante se dibujan los objetos de la finca y por qué?</p>
    <label for="rt"><b>Copia tu resultado y pégalo en el chat</b></label><textarea id="rt" rows="3" readonly>${esc(txt)}</textarea>
    <div class="row"><button class="btn gold" id="cp">Copiar resultado</button><button class="btn ghost" id="again">Jugar de nuevo</button><span id="cpm" class="hint"></span></div></div>`;
  $("#cp").onclick = () => { const say = m => $("#cpm").textContent = m; const ta = $("#rt");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => say("Copiado."), () => { ta.select(); say("Texto seleccionado: cópialo con Ctrl+C."); });
    else { ta.select(); say("Texto seleccionado: cópialo con Ctrl+C."); } };
  $("#again").onclick = () => newGame(G.name);
}

/* ===================== pestañas ===================== */
function show(tab) {
  $("#t-lab").setAttribute("aria-selected", tab === "lab"); $("#t-puz").setAttribute("aria-selected", tab === "puz");
  $("#v-lab").hidden = tab !== "lab"; $("#v-puz").hidden = tab !== "puz";
  if (tab === "lab") renderLab(); else renderPuz();
  try { history.replaceState(null, "", "#" + (tab === "lab" ? "laboratorio" : "rompecabezas")); } catch (e) {}
}
$("#t-lab").onclick = () => show("lab"); $("#t-puz").onclick = () => show("puz");
show(location.hash === "#rompecabezas" ? "puz" : "lab");
})();
</script>
